<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lumina Academy — Redirection</title>
  </head>
  <body>
    <p>
      Ouverture de Lumina Academy… <a href="./index.html#/tracks">Continuer</a>
    </p>
    <script>
      const old = location.hash.slice(1);
      location.replace(
        "./index.html#/tracks" +
          (false &&
          ["foundations", "core", "enterprise", "advanced"].includes(old)
            ? "/" + old
            : ""),
      );
    </script>
  </body>
</html>
